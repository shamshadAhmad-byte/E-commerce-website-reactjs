version: '3.8'
services:
  mongo:
    image: mongo:6.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  user-service:
    build: ./user-service
    ports:
      - "8001:8001"
    env_file:
      - ./user-service/.env
    depends_on:
      - mongo
      - rabbitmq

  product-service:
    build: ./product-service
    ports:
      - "8002:8002"
    env_file:
      - ./product-service/.env
    depends_on:
      - mongo
      - rabbitmq

  order-service:
    build: ./order-service
    ports:
      - "8003:8003"
    env_file:
      - ./order-service/.env
    depends_on:
      - mongo
      - rabbitmq

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - user-service
      - product-service
      - order-service

volumes:
  mongo-data:
    driver: local
